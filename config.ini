; SajhaBar v5 - Catppuccin Mocha | 1366x768

[colors]
base     = #E8181825
pill-1   = #252535
pill-2   = #1E2030
pill-3   = #1A1A2E
text     = #CDD6F4
subtext  = #7F849C
muted    = #45475A
blue     = #89B4FA
lavender = #B4BEFE
sapphire = #74C7EC
teal     = #94E2D5
green    = #A6E3A1
yellow   = #F9E2AF
peach    = #FAB387
red      = #F38BA8
pink     = #F5C2E7
mauve    = #CBA6F7

[bar/main]
monitor             = ${env:MONITOR:}
enable-ipc          = true
override-redirect   = false
bottom              = false
width               = 100%
height              = 30
background          = ${colors.base}
foreground          = ${colors.text}
line-size           = 0
padding-left        = 0
padding-right       = 1
module-margin-left  = 0
module-margin-right = 0
font-0 = "JetBrains Mono:size=9:weight=bold;3"
font-1 = "Font Awesome 6 Free:style=Solid:size=9;3"
font-2 = "JetBrains Mono:size=8;3"
font-3 = "Font Awesome 6 Brands:style=Regular:size=9;3"
cursor-click  = pointer
cursor-scroll = ns-resize
modules-left   = power-pill-l power-btn power-pill-r g music-pill-l music-prev music-info music-toggle music-next music-pill-r
modules-center = windows
modules-right  = sys-pill-l net g disk g cpu g temp g ram sys-pill-r g time-pill-l clock time-pill-r g tray-btn tray

[module/g]
type   = custom/text
format = " "

; ── POWER BUTTON ─────────────────────────────────────────

[module/power-pill-l]
type              = custom/text
format            = ""
format-foreground = ${colors.pill-1}
format-background = ${colors.base}

[module/power-pill-r]
type              = custom/text
format            = ""
format-foreground = ${colors.pill-1}
format-background = ${colors.base}

[module/power-btn]
type              = custom/text
format            = "%{T2}%{T-}"
format-background = ${colors.pill-1}
format-foreground = ${colors.red}
format-padding    = 2
click-left        = ~/.config/polybar/scripts/power-menu.sh &

; ── MUSIC ────────────────────────────────────────────────

[module/music-pill-l]
type              = custom/script
exec              = ~/.config/polybar/scripts/music-pill-l.sh
interval          = 1
format-foreground = ${colors.pill-2}
format-background = ${colors.base}

[module/music-pill-r]
type              = custom/script
exec              = ~/.config/polybar/scripts/music-pill-r.sh
interval          = 1
format-foreground = ${colors.pill-2}
format-background = ${colors.base}

[module/music-prev]
type              = custom/script
exec              = ~/.config/polybar/scripts/music-prev-icon.sh
interval          = 1
format-background = ${colors.pill-2}
format-foreground = ${colors.subtext}
format-padding    = 1
click-left        = playerctl previous

[module/music-info]
type              = custom/script
exec              = ~/.config/polybar/scripts/music.sh
interval          = 0.1
format-background = ${colors.pill-2}
format-foreground = ${colors.pink}
format-padding    = 1

[module/music-toggle]
type              = custom/script
exec              = ~/.config/polybar/scripts/music-toggle-icon.sh
interval          = 1
format-background = ${colors.pill-2}
format-foreground = ${colors.pink}
format-padding    = 1
click-left        = playerctl play-pause

[module/music-next]
type              = custom/script
exec              = ~/.config/polybar/scripts/music-next-icon.sh
interval          = 1
format-background = ${colors.pill-2}
format-foreground = ${colors.subtext}
format-padding    = 1
click-left        = playerctl next

; ── CENTER ───────────────────────────────────────────────

[module/windows]
type              = custom/script
exec              = ~/.config/polybar/scripts/windows.sh
interval          = 1
format-foreground = ${colors.text}
format-padding    = 1

; ── SYSTEM PILL ──────────────────────────────────────────

[module/sys-pill-l]
type              = custom/text
format            = ""
format-foreground = ${colors.pill-2}
format-background = ${colors.base}

[module/sys-pill-r]
type              = custom/text
format            = ""
format-foreground = ${colors.pill-2}
format-background = ${colors.base}

[module/net]
type              = custom/script
exec              = ~/.config/polybar/scripts/network-speed.sh
interval          = 2
format-foreground = ${colors.teal}
format-background = ${colors.pill-2}
format-padding    = 1
click-right       = ~/.config/polybar/scripts/net-detail.sh &

[module/disk]
type              = custom/script
exec              = ~/.config/polybar/scripts/disk-usage.sh
interval          = 30
format-foreground = ${colors.mauve}
format-background = ${colors.pill-2}
format-padding    = 1
click-right       = ~/.config/polybar/scripts/disk-detail.sh &

[module/cpu]
type              = custom/script
exec              = ~/.config/polybar/scripts/cpu-usage.sh
interval          = 2
format-background = ${colors.pill-2}
format-foreground = ${colors.red}
format-padding    = 1
click-right       = ~/.config/polybar/scripts/cpu-detail.sh &

[module/temp]
type              = custom/script
exec              = ~/.config/polybar/scripts/cpu-temp.sh
interval          = 2
format-background = ${colors.pill-2}
format-foreground = ${colors.peach}
format-padding    = 1
click-right       = ~/.config/polybar/scripts/temp-detail.sh &

[module/ram]
type              = custom/script
exec              = ~/.config/polybar/scripts/ram-usage.sh
interval          = 3
format-background = ${colors.pill-2}
format-foreground = ${colors.mauve}
format-padding    = 1
click-right       = ~/.config/polybar/scripts/ram-detail.sh &

; ── TIME ─────────────────────────────────────────────────

[module/time-pill-l]
type              = custom/text
format            = ""
format-foreground = ${colors.pill-3}
format-background = ${colors.base}

[module/time-pill-r]
type              = custom/text
format            = ""
format-foreground = ${colors.pill-3}
format-background = ${colors.base}

[module/clock]
type              = internal/date
interval          = 1
time              = %H:%M
format-prefix     = "%{T2}%{T-} "
format-prefix-foreground = ${colors.green}
format-foreground = ${colors.green}
format-background = ${colors.pill-3}
format-padding    = 1

; ── TRAY ─────────────────────────────────────────────────

[module/tray-btn]
type              = custom/script
exec              = ~/.config/polybar/scripts/tray-arrow.sh
interval          = 1
format-foreground = ${colors.subtext}
format-padding    = 1
click-left        = ~/.config/polybar/scripts/tray-toggle.sh &

[module/tray]
type              = internal/tray
format-margin     = 2px
tray-spacing      = 5px
tray-padding      = 2px
tray-size         = 55%
tray-background   = ${colors.base}
